<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160" role="img" aria-label="A .zt file: magic bytes, tensor blobs on page boundaries with padding between them, the manifest, and a 40-byte footer that points back at the manifest.">
