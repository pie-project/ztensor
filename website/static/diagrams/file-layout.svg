<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" width="720" height="196" role="img" aria-label="A .zt file: magic bytes, blobs on page boundaries with padding between them, the manifest, and a 40-byte footer that points back at the manifest.">
