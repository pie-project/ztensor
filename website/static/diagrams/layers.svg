<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 534" width="720" height="534" role="img" aria-label="The three layers and what sits above them. L0 is the container: magic, a page-aligned blob heap, the manifest blob and a footer. L1 is the manifest: for each tensor a shape, a layout, attributes, and for each part a dtype, a value type, a digest and a blob triple naming a shard, an offset and a length. L2 is the vocabulary: identifiers and their structural rules. Above all three, outside the format, a framework such as torch reads those names and decides what the values mean.">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fg { fill: #1c1e21; }
    .dim { fill: #57606a; }
    .rule { stroke: #d0d7de; }
    .edge { stroke: #b6bfc8; }
    .fill-alt { fill: #f6f7f8; }
    .accent { fill: #2b6cb0; }
    .accent-s { stroke: #2b6cb0; }
    .on-accent { fill: #ffffff; }
    .pad { stroke: #b6bfc8; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e3e3; }
      .dim { fill: #a8a8a8; }
      .rule { stroke: #3a3b3f; }
      .edge { stroke: #4d4e53; }
      .fill-alt { fill: #242526; }
      .accent { fill: #78a9e0; }
      .accent-s { stroke: #78a9e0; }
      .on-accent { fill: #1b1b1d; }
      .pad { stroke: #4d4e53; }
    }
  </style>
  <rect x="118" y="16" width="578" height="76" rx="3" class="fill-alt edge" stroke-width="1" stroke-dasharray="5 4" />
  <text class="fg" x="134" y="39" font-size="14" font-weight="600">Your framework — torch, numpy, your loader</text>
  <text class="mono dim" x="680" y="39" font-size="10.5" text-anchor="end">outside the format</text>
  <text class="dim" x="134" y="60" font-size="11.5">reads the names below and decides what the values <tspan font-style="italic">mean</tspan>:</text>
  <text class="mono fg" x="134" y="80" font-size="11">zt.quant_group/1 + f4_e2m1 + f8_e8m0</text>
  <text class="dim" x="384" y="80" font-size="11.5">→ a bf16 tensor on the device</text>
  <line class="edge" x1="158" y1="122" x2="158" y2="98" stroke-width="1.2" />
  <path d="M 154 104 L 158 94 L 162 104 Z" class="dim" />
  <text class="dim" x="174" y="112" font-size="11">zTensor stops here: it checks the names and hands over the bytes — it never interprets them.</text>
  <rect x="118" y="126" width="578" height="92" rx="3" class="fill-alt edge" stroke-width="1" />
  <text class="mono accent" x="104" y="149" font-size="13" text-anchor="end">L2</text>
  <text class="fg" x="134" y="149" font-size="14" font-weight="600">Vocabulary</text>
  <text class="mono dim" x="680" y="149" font-size="10.5" text-anchor="end">mortal — versioned, refusable</text>
  <text class="dim" x="248" y="174" font-size="10.5" text-anchor="end">layouts</text>
  <rect x="260.0" y="160" width="47.6" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="283.8" y="174" font-size="10.5" text-anchor="middle">dense</text>
  <rect x="315.6" y="160" width="117.1" height="20" rx="10" class="accent" stroke-width="1" />
  <text class="mono on-accent" x="374.1" y="174" font-size="10.5" text-anchor="middle">zt.quant_group/1</text>
  <rect x="440.7" y="160" width="85.5" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="483.5" y="174" font-size="10.5" text-anchor="middle">gguf.q4_k/1</text>
  <text class="dim" x="248" y="200" font-size="10.5" text-anchor="end">value types</text>
  <rect x="260.0" y="186" width="41.3" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="280.6" y="200" font-size="10.5" text-anchor="middle">bool</text>
  <rect x="309.3" y="186" width="60.2" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="339.4" y="200" font-size="10.5" text-anchor="middle">f4_e2m1</text>
  <rect x="377.5" y="186" width="60.2" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="407.6" y="200" font-size="10.5" text-anchor="middle">f8_e8m0</text>
  <rect x="445.7" y="186" width="72.9" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="482.2" y="200" font-size="10.5" text-anchor="middle">f8_e4m3fn</text>
  <text class="dim" x="134" y="212" font-size="10.5">just identifiers, and the structural rules that go with them — no semantics live here</text>
  <rect x="118" y="232" width="578" height="190" rx="3" class="fill-alt edge" stroke-width="1" />
  <text class="mono accent" x="104" y="255" font-size="13" text-anchor="end">L1</text>
  <text class="fg" x="134" y="255" font-size="14" font-weight="600">Manifest</text>
  <text class="mono dim" x="680" y="255" font-size="10.5" text-anchor="end">deterministic CBOR — version-gated</text>
  <text class="mono fg" x="136.0" y="276" font-size="10.5" font-weight="600" xml:space="preserve">"layer.0.w"</text>
  <text class="mono dim" x="205.5" y="276" font-size="10.5" xml:space="preserve">: {</text>
  <text class="mono dim" x="136.0" y="290" font-size="10.5" xml:space="preserve">  shape:      </text>
  <text class="mono fg" x="224.5" y="290" font-size="10.5" xml:space="preserve">[4096, 4096]</text>
  <text class="mono dim" x="136.0" y="304" font-size="10.5" xml:space="preserve">  layout:     </text>
  <text class="mono accent" x="224.5" y="304" font-size="10.5" xml:space="preserve">"zt.quant_group/1"</text>
  <text class="mono dim" x="136.0" y="318" font-size="10.5" xml:space="preserve">  attributes: </text>
  <text class="mono fg" x="224.5" y="318" font-size="10.5" xml:space="preserve">{ group_size: 128, … }</text>
  <text class="mono dim" x="136.0" y="332" font-size="10.5" xml:space="preserve">  parts: {</text>
  <text class="mono dim" x="136.0" y="346" font-size="10.5" xml:space="preserve">    data:   { dtype: </text>
  <text class="mono fg" x="268.7" y="346" font-size="10.5" xml:space="preserve">u8</text>
  <text class="mono dim" x="281.3" y="346" font-size="10.5" xml:space="preserve">, type: </text>
  <text class="mono fg" x="331.9" y="346" font-size="10.5" xml:space="preserve">"f4_e2m1"</text>
  <text class="mono dim" x="388.8" y="346" font-size="10.5" xml:space="preserve">, digest: </text>
  <text class="mono fg" x="452.0" y="346" font-size="10.5" xml:space="preserve">"xxh3:9f3c…"</text>
  <text class="mono dim" x="527.8" y="346" font-size="10.5" xml:space="preserve">,</text>
  <text class="mono dim" x="136.0" y="360" font-size="10.5" xml:space="preserve">              blob: </text>
  <text class="mono accent" x="262.4" y="360" font-size="10.5" xml:space="preserve">[shard 0, offset 65536, length 8388608]</text>
  <text class="mono dim" x="508.8" y="360" font-size="10.5" xml:space="preserve"> }</text>
  <text class="mono dim" x="136.0" y="374" font-size="10.5" xml:space="preserve">    scales: { dtype: </text>
  <text class="mono fg" x="268.7" y="374" font-size="10.5" xml:space="preserve">u8</text>
  <text class="mono dim" x="281.3" y="374" font-size="10.5" xml:space="preserve">, type: </text>
  <text class="mono fg" x="331.9" y="374" font-size="10.5" xml:space="preserve">"f8_e8m0"</text>
  <text class="mono dim" x="388.8" y="374" font-size="10.5" xml:space="preserve">, digest: </text>
  <text class="mono fg" x="452.0" y="374" font-size="10.5" xml:space="preserve">"xxh3:41ab…"</text>
  <text class="mono dim" x="527.8" y="374" font-size="10.5" xml:space="preserve">,</text>
  <text class="mono dim" x="136.0" y="388" font-size="10.5" xml:space="preserve">              blob: </text>
  <text class="mono fg" x="262.4" y="388" font-size="10.5" xml:space="preserve">[shard 0, offset 8454144, length 262144]</text>
  <text class="mono dim" x="515.1" y="388" font-size="10.5" xml:space="preserve"> } }</text>
  <text class="mono dim" x="136.0" y="402" font-size="10.5" xml:space="preserve">}</text>
  <text class="mono dim" x="136.0" y="416" font-size="10.5" xml:space="preserve">shards: { </text>
  <text class="mono fg" x="199.2" y="416" font-size="10.5" xml:space="preserve">1: { size: 4294967296, digest: "xxh3:a91f…" }</text>
  <text class="mono dim" x="483.6" y="416" font-size="10.5" xml:space="preserve"> }</text>
  <rect x="118" y="436" width="578" height="84" rx="3" class="fill-alt edge" stroke-width="2" />
  <text class="mono accent" x="104" y="459" font-size="13" text-anchor="end">L0</text>
  <text class="fg" x="134" y="459" font-size="14" font-weight="600">Container</text>
  <text class="mono dim" x="680" y="459" font-size="10.5" text-anchor="end">frozen — never changes</text>
  <rect x="136" y="470" width="44" height="28" rx="2" fill="none" class="edge" stroke-width="1" />
  <text class="mono dim" x="158.0" y="488" font-size="10" text-anchor="middle">magic</text>
  <rect class="accent" x="180" y="470" width="62" height="28" rx="2" opacity="0.4" />
  <text class="mono dim" x="211.0" y="488" font-size="10" text-anchor="middle">tensor</text>
