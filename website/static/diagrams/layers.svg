<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 606" width="720" height="606" role="img" aria-label="The three layers and what sits above them. L0 is the container: magic, a heap of page-aligned blobs that are all alike, the manifest blob and a footer. L1 is the manifest, naming for each tensor a shape, a layout, attributes, and for each part a dtype, a value type, a digest and a blob triple. L2 is the vocabulary: names only. Above all three, outside the format, a framework such as torch reads those names and decides what the values mean.">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fg { fill: #1c1e21; }
    .dim { fill: #57606a; }
    .rule { stroke: #d0d7de; }
    .edge { stroke: #b6bfc8; }
    .fill-alt { fill: #f6f7f8; }
    .accent { fill: #2b6cb0; }
    .accent-s { stroke: #2b6cb0; }
    .on-accent { fill: #ffffff; }
    .pad { stroke: #b6bfc8; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e3e3; }
      .dim { fill: #a8a8a8; }
      .rule { stroke: #3a3b3f; }
      .edge { stroke: #4d4e53; }
      .fill-alt { fill: #242526; }
      .accent { fill: #78a9e0; }
      .accent-s { stroke: #78a9e0; }
      .on-accent { fill: #1b1b1d; }
      .pad { stroke: #4d4e53; }
    }
  </style>
  <rect x="118" y="18" width="578" height="82" rx="3" class="fill-alt edge" stroke-width="1" stroke-dasharray="5 4" />
  <text class="fg" x="140.0" y="44.0" font-size="14" font-weight="600" xml:space="preserve">torch · numpy · your loader</text>
  <text class="mono dim" x="674.0" y="44.0" font-size="10.5" text-anchor="end" xml:space="preserve">outside the format</text>
  <text class="mono fg" x="140.0" y="66.0" font-size="10.5" xml:space="preserve">zt.quant_group/1 + f4_e2m1 + f8_e8m0  →  bf16</text>
  <text class="dim" x="140.0" y="86.0" font-size="11" xml:space="preserve">This decision is theirs, not ours.</text>
  <line class="edge" x1="162" y1="128" x2="162" y2="106" stroke-width="1.2" />
  <path d="M 158 112 L 162 102 L 166 112 Z" class="dim" />
  <text class="dim" x="178.0" y="122.0" font-size="11" xml:space="preserve">zTensor hands over bytes and names, and stops.</text>
  <rect x="118" y="136" width="578" height="96" rx="3" class="fill-alt edge" stroke-width="1" />
  <text class="mono accent" x="102.0" y="162.0" font-size="13" text-anchor="end" xml:space="preserve">L2</text>
  <text class="fg" x="140.0" y="162.0" font-size="14" font-weight="600" xml:space="preserve">Vocabulary</text>
  <text class="mono dim" x="674.0" y="162.0" font-size="10.5" text-anchor="end" xml:space="preserve">mortal — names only, refusable</text>
  <text class="dim" x="242.0" y="192.0" font-size="10.5" text-anchor="end" xml:space="preserve">layouts</text>
  <rect x="254.0" y="178" width="49.6" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="278.8" y="192.0" font-size="10.5" text-anchor="middle" xml:space="preserve">dense</text>
  <rect x="312.6" y="178" width="119.1" height="20" rx="10" class="accent" stroke-width="1" />
  <text class="mono on-accent" x="372.2" y="192.0" font-size="10.5" text-anchor="middle" xml:space="preserve">zt.quant_group/1</text>
  <rect x="440.7" y="178" width="87.5" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="484.5" y="192.0" font-size="10.5" text-anchor="middle" xml:space="preserve">gguf.q4_k/1</text>
  <text class="dim" x="242.0" y="218.0" font-size="10.5" text-anchor="end" xml:space="preserve">value types</text>
  <rect x="254.0" y="204" width="43.3" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="275.6" y="218.0" font-size="10.5" text-anchor="middle" xml:space="preserve">bool</text>
