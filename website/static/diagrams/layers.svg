  <text class="mono accent" x="102.0" y="160.0" font-size="13" text-anchor="end" xml:space="preserve">L2</text>
  <text class="fg" x="140.0" y="160.0" font-size="14" font-weight="600" xml:space="preserve">Vocabulary</text>
  <text class="mono dim" x="674.0" y="160.0" font-size="10.5" text-anchor="end" xml:space="preserve">mortal — names only, refusable</text>
  <text class="dim" x="242.0" y="190.0" font-size="10.5" text-anchor="end" xml:space="preserve">layouts</text>
  <rect x="254.0" y="176" width="49.6" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
