<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="The three layers with their actual contents. L2 holds vocabulary identifiers such as zt.quant_group/1 and f8_e4m3fn. L1 holds a manifest record naming a shape, a layout profile from L2, and a blob triple addressing bytes in L0. L0 holds the magic, the page-aligned blob heap, the manifest blob and the 40-byte footer.">
