  <rect x="242" y="446" width="16" height="28" fill="none" class="edge" stroke-width="1" />
  <rect class="accent" x="258" y="446" width="90" height="28" rx="2" opacity="1" />
  <clipPath id="z348"><rect x="348" y="446" width="14" height="28" /></clipPath>
  <g class="pad" stroke-width="1" opacity="0.5" clip-path="url(#z348)"><line x1="320" y1="474" x2="348" y2="446" /><line x1="326" y1="474" x2="354" y2="446" /><line x1="332" y1="474" x2="360" y2="446" /><line x1="338" y1="474" x2="366" y2="446" /><line x1="344" y1="474" x2="372" y2="446" /><line x1="350" y1="474" x2="378" y2="446" /><line x1="356" y1="474" x2="384" y2="446" /><line x1="362" y1="474" x2="390" y2="446" /><line x1="368" y1="474" x2="396" y2="446" /><line x1="374" y1="474" x2="402" y2="446" /><line x1="380" y1="474" x2="408" y2="446" /><line x1="386" y1="474" x2="414" y2="446" /></g>
  <rect x="348" y="446" width="14" height="28" fill="none" class="edge" stroke-width="1" />
  <rect class="accent" x="362" y="446" width="44" height="28" rx="2" opacity="0.4" />
  <rect x="406" y="446" width="62" height="28" rx="2" fill="none" class="edge" stroke-width="1" />
  <text class="mono dim" x="437.0" y="464" font-size="10" text-anchor="middle">manifest</text>
  <rect x="468" y="446" width="42" height="28" rx="2" fill="none" class="edge" stroke-width="1" />
  <text class="mono dim" x="489.0" y="464" font-size="10" text-anchor="middle">footer</text>
  <text class="mono dim" x="293" y="489" font-size="10" text-anchor="middle">blobs — 64 KiB aligned, and nothing here knows what they hold</text>
