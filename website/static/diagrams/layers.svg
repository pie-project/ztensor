  <text class="mono dim" x="392.8" y="391.5" font-size="10.5" xml:space="preserve">,</text>
  <text class="mono dim" x="140.0" y="407.0" font-size="10.5" xml:space="preserve">              digest: </text>
  <text class="mono fg" x="279.1" y="407.0" font-size="10.5" xml:space="preserve">"xxh3:9f3c…"</text>
  <text class="mono dim" x="354.9" y="407.0" font-size="10.5" xml:space="preserve">,</text>
  <text class="mono dim" x="140.0" y="422.5" font-size="10.5" xml:space="preserve">              blob: </text>
  <text class="mono accent" x="266.4" y="422.5" font-size="10.5" xml:space="preserve">[offset 65536, length 8388608]</text>
  <text class="mono dim" x="456.0" y="422.5" font-size="10.5" xml:space="preserve"> }</text>
  <text class="mono dim" x="140.0" y="438.0" font-size="10.5" xml:space="preserve">    scales: { dtype: </text>
  <text class="mono fg" x="272.7" y="438.0" font-size="10.5" xml:space="preserve">u8</text>
  <text class="mono dim" x="285.4" y="438.0" font-size="10.5" xml:space="preserve">, type: </text>
  <text class="mono fg" x="336.0" y="438.0" font-size="10.5" xml:space="preserve">"f8_e8m0"</text>
  <text class="mono dim" x="392.8" y="438.0" font-size="10.5" xml:space="preserve">,</text>
  <text class="mono dim" x="140.0" y="453.5" font-size="10.5" xml:space="preserve">              digest: </text>
  <text class="mono fg" x="279.1" y="453.5" font-size="10.5" xml:space="preserve">"xxh3:41ab…"</text>
  <text class="mono dim" x="354.9" y="453.5" font-size="10.5" xml:space="preserve">,</text>
  <text class="mono dim" x="140.0" y="469.0" font-size="10.5" xml:space="preserve">              blob: </text>
  <text class="mono fg" x="266.4" y="469.0" font-size="10.5" xml:space="preserve">[offset 8454144, length 262144]</text>
  <text class="mono dim" x="462.4" y="469.0" font-size="10.5" xml:space="preserve"> } }</text>
  <text class="mono dim" x="140.0" y="484.5" font-size="10.5" xml:space="preserve">  }</text>
  <text class="mono dim" x="159.0" y="484.5" font-size="10.5" xml:space="preserve">}</text>
  <text class="mono dim" x="140.0" y="500.0" font-size="10.5" xml:space="preserve">shards: { </text>
  <text class="mono fg" x="203.2" y="500.0" font-size="10.5" xml:space="preserve">"00001": { size: 4294967296, digest: "xxh3:a91f…" }</text>
  <text class="mono dim" x="525.6" y="500.0" font-size="10.5" xml:space="preserve"> }</text>
