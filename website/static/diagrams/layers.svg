  <line class="accent-s" x1="385.6" y1="343" x2="385.6" y2="440" stroke-width="1.2" />
  <path d="M 381.6 434 L 385.6 444 L 389.6 434 Z" class="accent" />
  <text class="mono accent" x="395.6" y="424" font-size="10">names a byte range</text>
