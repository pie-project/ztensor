  <rect x="242" y="470" width="16" height="28" fill="none" class="edge" stroke-width="1" />
  <rect class="accent" x="258" y="470" width="90" height="28" rx="2" opacity="1" />
  <text class="mono on-accent" x="303.0" y="488" font-size="10" text-anchor="middle">data</text>
  <clipPath id="z348"><rect x="348" y="470" width="14" height="28" /></clipPath>
  <g class="pad" stroke-width="1" opacity="0.5" clip-path="url(#z348)"><line x1="320" y1="498" x2="348" y2="470" /><line x1="326" y1="498" x2="354" y2="470" /><line x1="332" y1="498" x2="360" y2="470" /><line x1="338" y1="498" x2="366" y2="470" /><line x1="344" y1="498" x2="372" y2="470" /><line x1="350" y1="498" x2="378" y2="470" /><line x1="356" y1="498" x2="384" y2="470" /><line x1="362" y1="498" x2="390" y2="470" /><line x1="368" y1="498" x2="396" y2="470" /><line x1="374" y1="498" x2="402" y2="470" /><line x1="380" y1="498" x2="408" y2="470" /><line x1="386" y1="498" x2="414" y2="470" /></g>
  <rect x="348" y="470" width="14" height="28" fill="none" class="edge" stroke-width="1" />
  <rect class="accent" x="362" y="470" width="44" height="28" rx="2" opacity="0.4" />
  <text class="mono dim" x="384.0" y="488" font-size="10" text-anchor="middle">scales</text>
  <rect x="406" y="470" width="62" height="28" rx="2" fill="none" class="edge" stroke-width="1" />
  <text class="mono dim" x="437.0" y="488" font-size="10" text-anchor="middle">manifest</text>
  <rect x="468" y="470" width="42" height="28" rx="2" fill="none" class="edge" stroke-width="1" />
  <text class="mono dim" x="489.0" y="488" font-size="10" text-anchor="middle">footer</text>
  <text class="mono dim" x="524" y="488" font-size="10">64 KiB-aligned blob heap</text>
  <line class="accent-s" x1="281.3" y1="294" x2="281.3" y2="226" stroke-width="1.2" />
  <path d="M 277.3 232 L 281.3 222 L 285.3 232 Z" class="accent" />
  <text class="mono accent" x="291.3" y="228" font-size="10">names a profile</text>
  <line class="accent-s" x1="385.6" y1="364" x2="385.6" y2="464" stroke-width="1.2" />
  <path d="M 381.6 458 L 385.6 468 L 389.6 458 Z" class="accent" />
  <text class="mono accent" x="395.6" y="448" font-size="10">names a byte range</text>
