  <text class="mono fg" x="337.4" y="218.0" font-size="10.5" text-anchor="middle" xml:space="preserve">f4_e2m1</text>
  <rect x="377.5" y="204" width="62.2" height="20" rx="10" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="408.7" y="218.0" font-size="10.5" text-anchor="middle" xml:space="preserve">f8_e8m0</text>
  <rect x="118" y="254" width="578" height="214" rx="3" class="fill-alt edge" stroke-width="1" />
  <text class="mono accent" x="102.0" y="280.0" font-size="13" text-anchor="end" xml:space="preserve">L1</text>
  <text class="fg" x="140.0" y="280.0" font-size="14" font-weight="600" xml:space="preserve">Manifest</text>
  <text class="mono dim" x="674.0" y="280.0" font-size="10.5" text-anchor="end" xml:space="preserve">deterministic CBOR — version-gated</text>
  <text class="mono fg" x="140.0" y="306.0" font-size="10.5" font-weight="600" xml:space="preserve">"layer.0.w"</text>
  <text class="mono dim" x="209.5" y="306.0" font-size="10.5" xml:space="preserve">: {</text>
  <text class="mono dim" x="140.0" y="321.5" font-size="10.5" xml:space="preserve">  shape:      </text>
  <text class="mono fg" x="228.5" y="321.5" font-size="10.5" xml:space="preserve">[4096, 4096]</text>
  <text class="mono dim" x="140.0" y="337.0" font-size="10.5" xml:space="preserve">  layout:     </text>
  <text class="mono accent" x="228.5" y="337.0" font-size="10.5" xml:space="preserve">"zt.quant_group/1"</text>
  <text class="mono dim" x="140.0" y="352.5" font-size="10.5" xml:space="preserve">  attributes: </text>
  <text class="mono fg" x="228.5" y="352.5" font-size="10.5" xml:space="preserve">{ … }</text>
  <text class="mono dim" x="140.0" y="368.0" font-size="10.5" xml:space="preserve">  parts: {</text>
  <text class="mono dim" x="140.0" y="383.5" font-size="10.5" xml:space="preserve">    data:   { dtype: </text>
  <text class="mono fg" x="272.7" y="383.5" font-size="10.5" xml:space="preserve">u8</text>
  <text class="mono dim" x="285.4" y="383.5" font-size="10.5" xml:space="preserve">, type: </text>
  <text class="mono fg" x="336.0" y="383.5" font-size="10.5" xml:space="preserve">"f4_e2m1"</text>
  <text class="mono dim" x="392.8" y="383.5" font-size="10.5" xml:space="preserve">,</text>
  <text class="mono dim" x="140.0" y="399.0" font-size="10.5" xml:space="preserve">              digest: </text>
  <text class="mono fg" x="279.1" y="399.0" font-size="10.5" xml:space="preserve">"xxh3:9f3c…"</text>
  <text class="mono dim" x="354.9" y="399.0" font-size="10.5" xml:space="preserve">,</text>
  <text class="mono dim" x="140.0" y="414.5" font-size="10.5" xml:space="preserve">              blob: </text>
  <text class="mono accent" x="266.4" y="414.5" font-size="10.5" xml:space="preserve">[shard 0, offset 65536, length 8388608]</text>
  <text class="mono dim" x="512.9" y="414.5" font-size="10.5" xml:space="preserve"> }</text>
  <text class="mono dim" x="140.0" y="430.0" font-size="10.5" xml:space="preserve">    scales: { dtype: </text>
  <text class="mono fg" x="272.7" y="430.0" font-size="10.5" xml:space="preserve">u8</text>
  <text class="mono dim" x="285.4" y="430.0" font-size="10.5" xml:space="preserve">, type: </text>
  <text class="mono fg" x="336.0" y="430.0" font-size="10.5" xml:space="preserve">"f8_e8m0"</text>
  <text class="mono dim" x="392.8" y="430.0" font-size="10.5" xml:space="preserve">,</text>
  <text class="mono dim" x="140.0" y="445.5" font-size="10.5" xml:space="preserve">              digest: </text>
  <text class="mono fg" x="279.1" y="445.5" font-size="10.5" xml:space="preserve">"xxh3:41ab…"</text>
  <text class="mono dim" x="354.9" y="445.5" font-size="10.5" xml:space="preserve">,</text>
  <text class="mono dim" x="140.0" y="461.0" font-size="10.5" xml:space="preserve">              blob: </text>
  <text class="mono fg" x="266.4" y="461.0" font-size="10.5" xml:space="preserve">[shard 0, offset 8454144, length 262144]</text>
  <text class="mono dim" x="519.3" y="461.0" font-size="10.5" xml:space="preserve"> } }</text>
  <text class="mono dim" x="140.0" y="476.5" font-size="10.5" xml:space="preserve">}</text>
  <text class="mono dim" x="140.0" y="496.0" font-size="10.5" xml:space="preserve">shards: { 1: { size: 4294967296, digest: "xxh3:a91f…" } }</text>
  <rect x="118" y="490" width="578" height="96" rx="3" class="fill-alt edge" stroke-width="2" />
  <text class="mono accent" x="102.0" y="516.0" font-size="13" text-anchor="end" xml:space="preserve">L0</text>
  <text class="fg" x="140.0" y="516.0" font-size="14" font-weight="600" xml:space="preserve">Container</text>
  <text class="mono dim" x="674.0" y="516.0" font-size="10.5" text-anchor="end" xml:space="preserve">frozen — never changes</text>
