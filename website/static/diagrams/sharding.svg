  <text class="mono dim" x="426.0" y="221" font-size="9.5">magic · blobs · footer, no manifest</text>
  <text class="dim" x="96" y="252" font-size="11.5">No file name appears anywhere in the format. Where a shard lives is the transport’s question —</text>
  <text class="dim" x="96" y="268" font-size="11.5">answered by position (<tspan class="mono">model-00001.zt</tspan>) or by content (<tspan class="mono">blobs/xxh3/&lt;hex&gt;</tspan>) — so renaming cannot break a model.</text>
