  <text class="dim" x="96" y="264" font-size="11.5">The format holds no file names. Where a shard lives is the transport’s question, answered</text>
  <text class="dim" x="96" y="280" font-size="11.5">positionally (<tspan class="mono">model-00001.zt</tspan>) or by content (<tspan class="mono">blobs/xxh3/&lt;hex&gt;</tspan>) — so renaming a model cannot break it.</text>
