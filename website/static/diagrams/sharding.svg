<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" width="720" height="448" role="img" aria-label="Three .zt files drawn identically — model.zt, model-001.zt and model-002.zt. Each is magic bytes, aligned tensor blobs and a 40-byte footer, in the same places. The only difference is the manifest slot: model.zt has one, and the two shards leave it empty.">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fg { fill: #1c1e21; }
    .dim { fill: #57606a; }
    .edge { stroke: #b6bfc8; }
    .fill-alt { fill: #f6f7f8; }
    .accent { fill: #2b6cb0; }
    .accent-s { stroke: #2b6cb0; }
    .on-accent { fill: #ffffff; }
    .pad { stroke: #b6bfc8; }
    .slot { stroke: #b6bfc8; fill: none; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e3e3; }
      .dim { fill: #a8a8a8; }
      .edge { stroke: #4d4e53; }
      .fill-alt { fill: #242526; }
      .accent { fill: #78a9e0; }
      .accent-s { stroke: #78a9e0; }
      .on-accent { fill: #1b1b1d; }
      .pad { stroke: #4d4e53; }
      .slot { stroke: #4d4e53; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" class="pad" stroke-width="1" opacity="0.55" />
    </pattern>
  </defs>

  <!-- the anatomy, named once: every file below has these four slots in these places -->
  <text class="dim" x="147" y="24" font-size="10" text-anchor="middle" xml:space="preserve">magic</text>
  <text class="dim" x="323" y="24" font-size="10" text-anchor="middle" xml:space="preserve">tensor blobs, 64 KiB aligned</text>
  <text class="dim" x="547" y="24" font-size="10" text-anchor="middle" xml:space="preserve">manifest</text>
  <text class="dim" x="632" y="24" font-size="10" text-anchor="middle" xml:space="preserve">footer</text>

  <!-- ================= model.zt ================= -->
  <rect x="112" y="36" width="552" height="74" rx="3" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="130" y="60" font-size="12" font-weight="600" xml:space="preserve">model.zt</text>
  <text class="dim" x="646" y="60" font-size="10" text-anchor="end" xml:space="preserve">the root — its manifest addresses all three files</text>
  <rect x="130" y="70" width="34" height="24" rx="2" class="slot" stroke-width="1" />
  <rect class="accent" x="170" y="70" width="80" height="24" rx="2" />
  <rect x="250" y="70" width="12" height="24" fill="url(#hatch)" />
  <rect class="accent" x="262" y="70" width="110" height="24" rx="2" />
  <rect x="372" y="70" width="12" height="24" fill="url(#hatch)" />
  <rect class="accent" x="384" y="70" width="80" height="24" rx="2" />
  <rect x="464" y="70" width="12" height="24" fill="url(#hatch)" />
  <rect class="accent" x="482" y="70" width="130" height="24" rx="2" />
  <text class="mono on-accent" x="547" y="86" font-size="10.5" text-anchor="middle" xml:space="preserve">manifest</text>
  <rect x="618" y="70" width="28" height="24" rx="2" class="slot" stroke-width="1" />

  <!-- what that one manifest holds -->
  <text class="dim" x="130" y="136" font-size="9.5" xml:space="preserve">what model.zt's manifest says</text>
  <text class="mono fg" x="130" y="152" font-size="10.5" xml:space="preserve">"layer.9.w"</text>
  <text class="mono dim" x="211" y="152" font-size="10.5" xml:space="preserve">blob [65536, 8388608]  shard</text>
  <text class="mono accent" x="398" y="152" font-size="10.5" xml:space="preserve">"00001"</text>
  <text class="mono dim" x="130" y="169" font-size="10.5" xml:space="preserve">shard table</text>
  <text class="mono accent" x="211" y="169" font-size="10.5" xml:space="preserve">"00001"</text>
  <text class="mono dim" x="262" y="169" font-size="10.5" xml:space="preserve">4.0 GiB · xxh3:a91f7c…</text>
  <text class="mono accent" x="412" y="169" font-size="10.5" xml:space="preserve">"00002"</text>
  <text class="mono dim" x="463" y="169" font-size="10.5" xml:space="preserve">4.0 GiB · xxh3:7c04b2…</text>

  <!-- ================= model-001.zt ================= -->
  <rect x="112" y="186" width="552" height="74" rx="3" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="130" y="210" font-size="12" font-weight="600" xml:space="preserve">model-001.zt</text>
  <text class="dim" x="646" y="210" font-size="10" text-anchor="end" xml:space="preserve">matches the row "00001" by size and digest</text>
  <rect x="130" y="220" width="34" height="24" rx="2" class="slot" stroke-width="1" />
  <rect class="accent" x="170" y="220" width="80" height="24" rx="2" />
  <rect x="250" y="220" width="12" height="24" fill="url(#hatch)" />
  <rect class="accent" x="262" y="220" width="110" height="24" rx="2" />
  <rect x="372" y="220" width="12" height="24" fill="url(#hatch)" />
  <rect class="accent" x="384" y="220" width="80" height="24" rx="2" />
  <rect x="464" y="220" width="12" height="24" fill="url(#hatch)" />
  <rect x="482" y="220" width="130" height="24" rx="2" class="slot" stroke-width="1" stroke-dasharray="4 3" />
  <text class="mono dim" x="547" y="236" font-size="10.5" text-anchor="middle" xml:space="preserve">no manifest</text>
  <rect x="618" y="220" width="28" height="24" rx="2" class="slot" stroke-width="1" />

  <!-- ================= model-002.zt ================= -->
  <rect x="112" y="278" width="552" height="74" rx="3" class="fill-alt edge" stroke-width="1" />
  <text class="mono fg" x="130" y="302" font-size="12" font-weight="600" xml:space="preserve">model-002.zt</text>
  <text class="dim" x="646" y="302" font-size="10" text-anchor="end" xml:space="preserve">matches the row "00002" by size and digest</text>
  <rect x="130" y="312" width="34" height="24" rx="2" class="slot" stroke-width="1" />
  <rect class="accent" x="170" y="312" width="80" height="24" rx="2" />
  <rect x="250" y="312" width="12" height="24" fill="url(#hatch)" />
  <rect class="accent" x="262" y="312" width="110" height="24" rx="2" />
  <rect x="372" y="312" width="12" height="24" fill="url(#hatch)" />
  <rect class="accent" x="384" y="312" width="80" height="24" rx="2" />
  <rect x="464" y="312" width="12" height="24" fill="url(#hatch)" />
  <rect x="482" y="312" width="130" height="24" rx="2" class="slot" stroke-width="1" stroke-dasharray="4 3" />
  <text class="mono dim" x="547" y="328" font-size="10.5" text-anchor="middle" xml:space="preserve">no manifest</text>
  <rect x="618" y="312" width="28" height="24" rx="2" class="slot" stroke-width="1" />

  <!-- the one manifest reaching the other two files, clear of every slot -->
  <path d="M 547 94 V 118 H 682 V 232" class="accent-s" fill="none" stroke-width="1.2" stroke-dasharray="4 3" />
  <path d="M 682 232 V 324" class="accent-s" fill="none" stroke-width="1.2" stroke-dasharray="4 3" />
  <path d="M 666 232 L 676 227 L 676 237 Z" class="accent" />
  <path d="M 666 324 L 676 319 L 676 329 Z" class="accent" />

  <text class="dim" x="112" y="384" font-size="11.5" xml:space="preserve">All three are .zt containers with the same anatomy. A shard differs in</text>
  <text class="dim" x="112" y="401" font-size="11.5" xml:space="preserve">one way: no manifest, so it says nothing about its own bytes.</text>
  <text class="dim" x="112" y="423" font-size="11.5" xml:space="preserve">A table row names a shard, it does not locate one. Size and digest are</text>
  <text class="dim" x="112" y="440" font-size="11.5" xml:space="preserve">the identity, so renaming a file cannot break the model.</text>
</svg>
