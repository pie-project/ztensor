<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" width="720" height="254" role="img" aria-label="The same three tensors written twice. In canonical .zt each starts on a 64 KiB page boundary and padding fills the rest, so every page holds one tensor. In safetensors they are packed back to back and two pages end up holding two tensors each.">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fg { fill: #1c1e21; }
    .dim { fill: #57606a; }
    .rule { stroke: #d0d7de; }
    .edge { stroke: #b6bfc8; }
    .fill-alt { fill: #f6f7f8; }
    .accent { fill: #2b6cb0; }
    .accent-s { stroke: #2b6cb0; }
    .on-accent { fill: #ffffff; }
    .pad { stroke: #b6bfc8; }
    .warn { fill: #d64545; stroke: #d64545; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e3e3; }
      .dim { fill: #a8a8a8; }
      .rule { stroke: #3a3b3f; }
      .edge { stroke: #4d4e53; }
      .fill-alt { fill: #242526; }
      .accent { fill: #78a9e0; }
      .accent-s { stroke: #78a9e0; }
      .on-accent { fill: #1b1b1d; }
      .pad { stroke: #4d4e53; }
      .warn { fill: #f08a8a; stroke: #f08a8a; }
    }
  </style>
  <line class="rule" x1="112.0" y1="46" x2="112.0" y2="228" stroke-width="1" />
  <text class="mono dim" x="112.0" y="38" font-size="10" text-anchor="middle">0</text>
  <line class="rule" x1="257.0" y1="46" x2="257.0" y2="228" stroke-width="1" />
  <text class="mono dim" x="257.0" y="38" font-size="10" text-anchor="middle">64 KiB</text>
  <line class="rule" x1="402.0" y1="46" x2="402.0" y2="228" stroke-width="1" />
  <text class="mono dim" x="402.0" y="38" font-size="10" text-anchor="middle">128</text>
  <line class="rule" x1="547.0" y1="46" x2="547.0" y2="228" stroke-width="1" />
  <text class="mono dim" x="547.0" y="38" font-size="10" text-anchor="middle">192</text>
  <line class="rule" x1="692.0" y1="46" x2="692.0" y2="228" stroke-width="1" />
  <text class="mono dim" x="692.0" y="38" font-size="10" text-anchor="middle">256</text>
  <text class="mono dim" x="112.0" y="244" font-size="10">each column is one 64 KiB page</text>
  <text class="fg" x="98.0" y="87" font-size="13" text-anchor="end">.zt</text>
  <text class="mono dim" x="98.0" y="102" font-size="10" text-anchor="end">canonical</text>
  <rect class="accent" x="112.0" y="70" width="226.6" height="36" rx="2" />
  <text class="mono on-accent" x="120.0" y="92" font-size="11">a</text>
