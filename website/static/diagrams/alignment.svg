  <g class="pad" stroke-width="1" opacity="0.5" clip-path="url(#c70192)"><line x1="479.3" y1="106" x2="515.3" y2="70" /><line x1="485.3" y1="106" x2="521.3" y2="70" /><line x1="491.3" y1="106" x2="527.3" y2="70" /><line x1="497.3" y1="106" x2="533.3" y2="70" /><line x1="503.3" y1="106" x2="539.3" y2="70" /><line x1="509.3" y1="106" x2="545.3" y2="70" /><line x1="515.3" y1="106" x2="551.3" y2="70" /><line x1="521.3" y1="106" x2="557.3" y2="70" /><line x1="527.3" y1="106" x2="563.3" y2="70" /><line x1="533.3" y1="106" x2="569.3" y2="70" /><line x1="539.3" y1="106" x2="575.3" y2="70" /><line x1="545.3" y1="106" x2="581.3" y2="70" /><line x1="551.3" y1="106" x2="587.3" y2="70" /><line x1="557.3" y1="106" x2="593.3" y2="70" /><line x1="563.3" y1="106" x2="599.3" y2="70" /><line x1="569.3" y1="106" x2="605.3" y2="70" /><line x1="575.3" y1="106" x2="611.3" y2="70" /><line x1="581.3" y1="106" x2="617.3" y2="70" /></g>
  <rect x="515.3" y="70" width="31.7" height="36" fill="none" class="edge" stroke-width="1" />
  <rect class="accent" x="547.0" y="70" width="135.9" height="36" rx="2" />
  <text class="mono on-accent" x="555.0" y="92" font-size="11">c</text>
  <text class="dim" x="112.0" y="124" font-size="11">every page holds one tensor — any of them can be mapped, or dropped, on its own</text>
  <text class="fg" x="98.0" y="193" font-size="13" text-anchor="end">safetensors</text>
  <text class="mono dim" x="98.0" y="208" font-size="10" text-anchor="end">packed</text>
  <rect class="warn" x="257.0" y="169" width="145.0" height="50" rx="2" fill-opacity="0.13" stroke-width="1.5" stroke-opacity="0.75" />
  <rect class="warn" x="402.0" y="169" width="145.0" height="50" rx="2" fill-opacity="0.13" stroke-width="1.5" stroke-opacity="0.75" />
  <rect class="accent" x="112.0" y="176" width="226.6" height="36" rx="2" />
  <text class="mono on-accent" x="120.0" y="198" font-size="11">a</text>
  <rect class="accent" x="338.6" y="176" width="113.3" height="36" rx="2" />
  <text class="mono on-accent" x="346.6" y="198" font-size="11">b</text>
  <rect class="accent" x="451.8" y="176" width="135.9" height="36" rx="2" />
  <text class="mono on-accent" x="459.8" y="198" font-size="11">c</text>
  <text class="mono warn" x="329.5" y="164" font-size="9.5" text-anchor="middle" stroke="none">a + b</text>
  <text class="mono warn" x="474.5" y="164" font-size="9.5" text-anchor="middle" stroke="none">b + c</text>
  <text class="dim" x="112.0" y="230" font-size="11">2 pages hold two tensors — neither can be dropped without the other</text>
</svg>
