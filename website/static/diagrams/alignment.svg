  <g class="pad" stroke-width="1" opacity="0.5" clip-path="url(#c70128)"><line x1="302.6" y1="106" x2="338.6" y2="70" /><line x1="308.6" y1="106" x2="344.6" y2="70" /><line x1="314.6" y1="106" x2="350.6" y2="70" /><line x1="320.6" y1="106" x2="356.6" y2="70" /><line x1="326.6" y1="106" x2="362.6" y2="70" /><line x1="332.6" y1="106" x2="368.6" y2="70" /><line x1="338.6" y1="106" x2="374.6" y2="70" /><line x1="344.6" y1="106" x2="380.6" y2="70" /><line x1="350.6" y1="106" x2="386.6" y2="70" /><line x1="356.6" y1="106" x2="392.6" y2="70" /><line x1="362.6" y1="106" x2="398.6" y2="70" /><line x1="368.6" y1="106" x2="404.6" y2="70" /><line x1="374.6" y1="106" x2="410.6" y2="70" /><line x1="380.6" y1="106" x2="416.6" y2="70" /><line x1="386.6" y1="106" x2="422.6" y2="70" /><line x1="392.6" y1="106" x2="428.6" y2="70" /><line x1="398.6" y1="106" x2="434.6" y2="70" /><line x1="404.6" y1="106" x2="440.6" y2="70" /><line x1="410.6" y1="106" x2="446.6" y2="70" /><line x1="416.6" y1="106" x2="452.6" y2="70" /><line x1="422.6" y1="106" x2="458.6" y2="70" /><line x1="428.6" y1="106" x2="464.6" y2="70" /><line x1="434.6" y1="106" x2="470.6" y2="70" /></g>
  <rect x="338.6" y="70" width="63.4" height="36" fill="none" class="edge" stroke-width="1" />
  <text class="mono dim" x="370.3" y="60" font-size="9.5" text-anchor="middle">padding</text>
  <rect class="accent" x="402.0" y="70" width="113.3" height="36" rx="2" />
  <text class="mono on-accent" x="410.0" y="92" font-size="11">b</text>
