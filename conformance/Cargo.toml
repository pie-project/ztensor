[package]
name = "conformance"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
# The zstd feature is enabled here so a workspace-wide `cargo test` builds
# ztensor with it (feature unification) and runs the encoding tests. The
# corpus itself contains no zstd files: compressed bytes are not stable
# across zstd library versions, and corpus files must be byte-exact.
ztensor = { workspace = true, features = ["zstd"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
# `zt.sparse_csr/1` assembly lives with the other layout profiles, outside the
# core crate, so the corpus reaches it through here.
ztensor-compat = { workspace = true }

[[bin]]
name = "gen"
path = "src/bin/gen.rs"
