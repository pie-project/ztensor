name: Release

# Two artifacts, two tags, two versions.
#
#   v2.1.1     -> the crates, from the workspace version
#   py-v2.1.2  -> the wheels, from ztensor-py's own version
#
# They were one number once, which meant a change confined to the bindings
# moved `ztensor` on crates.io and a crate release rebuilt 20 wheels with
# nothing new in them. The tag is still the source of truth: each job refuses
# to publish if the manifest it reads disagrees with the tag that started it.
on:
  push:
    tags: ["v*", "py-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  which:
    name: which artifact
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.pick.outputs.crates }}
      python: ${{ steps.pick.outputs.python }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        name: Compare the tag against the manifest it names
        run: |
          set -e
          ref="$GITHUB_REF_NAME"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          py="$(grep -m1 '^version' ztensor-py/pyproject.toml | cut -d'"' -f2)"
          pycrate="$(grep -m1 '^version' ztensor-py/Cargo.toml | cut -d'"' -f2)"
          echo "ref=$ref crates=$crate python=$py (py crate $pycrate)"

          # `pyproject.toml` and `ztensor-py/Cargo.toml` are what maturin reads
          # for the wheel name and the module version; they have to agree
          # whichever tag is being built.
          test "$py" = "$pycrate" || {
            echo "::error::ztensor-py/pyproject.toml $py != ztensor-py/Cargo.toml $pycrate"
            exit 1
          }

          case "$ref" in
            py-v*)
              version="${ref#py-v}"
              test "$version" = "$py" || {
                echo "::error::tag $version != python $py"; exit 1; }
              echo "crates=false" >> "$GITHUB_OUTPUT"
              echo "python=true"  >> "$GITHUB_OUTPUT"
              ;;
            v*)
              version="${ref#v}"
              test "$version" = "$crate" || {
                echo "::error::tag $version != crate $crate"; exit 1; }
              echo "crates=true"  >> "$GITHUB_OUTPUT"
              echo "python=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # workflow_dispatch, with no tag to go on: build nothing and say
              # so, rather than guessing which half was meant.
              echo "::error::run this from a v* or py-v* tag"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Wheels are per-version because the bindings are not abi3: the buffer
  # protocol is not in the limited API, and zero-copy is the point of them.
  #
  # Linux and macOS only. Windows is not tested (see the formats page,
  # "Platform support"), and shipping a wheel for a platform nobody has run
  # would be claiming support that does not exist.
  wheels:
    name: wheel (${{ matrix.platform.target }}, py${{ matrix.python }})
    needs: which
    if: needs.which.outputs.python == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          - { runner: macos-latest, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --manifest-path ztensor-py/Cargo.toml
            --interpreter python${{ matrix.python }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist

  sdist:
    name: sdist
    needs: which
    if: needs.which.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path ztensor-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  pypi:
    name: publish to PyPI
    needs: [which, wheels, sdist]
    if: needs.which.outputs.python == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no token to leak
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A release can fail halfway: 2.0.0 landed 20 wheels and no sdist,
          # and the retry then has to be allowed to skip what is already up.
          skip-existing: true

  # Order matters: a dependent crate cannot be verified until the crate it
  # depends on is on the index.
  crates:
    name: publish to crates.io
    needs: which
    if: needs.which.outputs.crates == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.which.outputs.version }}
        run: |
          set -e
          for crate in ztensor ztensor-compat ztensor-cli; do
            echo "::group::$crate"
            # Already on the index means a previous run got this far, so the
            # retry has nothing to do for this crate.
            if curl -sf -H "User-Agent: ztensor-release" \
                 "https://crates.io/api/v1/crates/$crate/$VERSION" >/dev/null; then
              echo "$crate $VERSION is already published; skipping"
            else
              cargo publish -p "$crate"
              # crates.io needs a moment before a dependent can resolve it.
              sleep 30
            fi
            echo "::endgroup::"
          done
