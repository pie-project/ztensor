name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      # The conformance corpus is the gate: every case in `all_cases()`
      # must behave, and the exported golden files must still match it.
      - name: Test (all features)
        run: cargo test --all-features

      # Release mode matters here: several hardening regressions only
      # reproduce without debug overflow checks.
      - name: Hostile-input regressions (release)
        run: cargo test --release -p ztensor-compat --all-features --test hostile

      - name: Corpus is in sync
        run: |
          cargo run -q -p conformance --bin gen
          git diff --exit-code conformance/corpus

  # `cfg(not(unix))` code is code no CI platform above compiles, and a
  # fallback whose first build is a user's is not a fallback. wasi is the
  # cheapest non-unix target there is, so it stands in as the compile gate;
  # what the fallback actually *does* is tested on unix, against the
  # platform path it replaces.
  portability:
    name: non-unix compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ztensor --target wasm32-wasip1 --all-targets

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Short runs: enough to catch a regression that panics immediately,
      # not a substitute for a real fuzzing campaign.
      # The first corpus directory is the one libFuzzer *writes* to; the
      # conformance corpus is passed after it, read-only, as seeds.
      - name: Container and CBOR
        run: |
          mkdir -p fuzz/corpus/fuzz_validate
          cargo fuzz run fuzz_validate fuzz/corpus/fuzz_validate conformance/corpus/valid \
            -- -max_total_time=60
          cargo fuzz run fuzz_cbor -- -max_total_time=60
      - name: Foreign-format parsers
        run: cargo fuzz run fuzz_compat -- -max_total_time=120 -rss_limit_mb=2048

  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The bindings are not abi3 — the buffer protocol is not in the
        # limited API — so a wheel is per-version. CI covers the floor and
        # the current release; publishing covers every version in between.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: |
          pip install maturin
          maturin build -m ztensor-py/Cargo.toml --release
      # The suite, not a hand-written snippet. An inline smoke test is a
      # second copy of the API that nothing forces anyone to update, and
      # this one sat here calling four methods that no longer existed.
      #
      # numpy is not optional here even though it is optional for the
      # library: the DLPack and buffer-protocol tests are the ones that
      # exercise the unsafe code, and without numpy they quietly skip.
      - name: Install and test
        run: |
          # Install the built wheel by path: `pip install ztensor` would
          # resolve the unrelated package of that name on PyPI.
          pip install --no-index --find-links target/wheels ztensor
          pip install pytest numpy
          pytest ztensor-py/tests -q

      # The stubs are a second description of the same API, so something has
      # to hold them to it. This caught four real mismatches the first time
      # it ran, including a `__init__` that is a `__new__` at runtime.
      - name: Stubs match the module
        run: |
          pip install mypy
          python -m mypy.stubtest ztensor._ztensor --ignore-missing-stub
