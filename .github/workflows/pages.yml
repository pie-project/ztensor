name: Pages

# Automatic on the default branch; `workflow_dispatch` so the site can also be
# built from a branch while one is in flight.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a run in progress finish rather than cancelling
# it: a half-replaced site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The figures are hand-authored SVG, and both ways they break (text past
      # the frame, text painted over by a later shape) are invisible in the
      # source and easy to miss in review.
      - name: Figures stay inside their frames
        run: python website/check_diagrams.py

      - name: Build
        run: |
          pip install markdown
          python website/build.py
      # A dead link is the one defect a static site can ship silently, so it
      # is checked here rather than found by a reader. Anchors are checked
      # too: the pages link into each other's sections, and a renamed heading
      # breaks that without breaking anything a file-existence check sees.
      - name: Every local link and anchor resolves
        run: |
          python - <<'EOF'
          import pathlib, re, sys
          root = pathlib.Path("website/_site")
          files = {p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}
          ids = {
              p.relative_to(root).as_posix(): set(re.findall(r'id="([^"]+)"', p.read_text()))
              for p in root.rglob("*.html")
          }
          bad = []
          for page in root.rglob("*.html"):
              here = page.relative_to(root).as_posix()
              text = page.read_text()
              for ref in re.findall(r'(?:href|src)="([^"]+)"', text):
                  if ref.startswith(("http", "mailto:", "data:")):
                      continue
                  target, _, frag = ref.partition("#")
                  page_ref = here if not target else target
                  if target and target not in files:
                      bad.append(f"{here} -> {ref}")
                  elif frag and frag not in ids.get(page_ref, set()):
                      bad.append(f"{here} -> {ref} (no such anchor)")
              bad += [f"{here} -> {m}" for m in re.findall(r'href="[^"]*\.md"', text)]
          if bad:
              print("\n".join(f"::error::dead link: {b}" for b in bad))
              sys.exit(1)
          print(f"{len(ids)} pages, every local link and anchor resolves")
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
