[package]
name = "ztensor-cli"
version.workspace = true
description = "zt: inspect, verify, convert, and diff tensor files"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tensor", "cli", "safetensors", "gguf", "checkpoint"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
name = "zt"
path = "src/main.rs"

[dependencies]
ztensor = { workspace = true, features = ["zstd"] }
ztensor-compat = { workspace = true, features = [
    "safetensors",
    "gguf",
    "npz",
    "pickle",
    "hdf5",
    "onnx",
] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
