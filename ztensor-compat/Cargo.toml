[package]
name = "ztensor-compat"
version = "2.0.0-alpha.0"
description = "Foreign tensor formats projected into the zTensor object model"
authors = ["In Gim <in.gim@icloud.com>"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Defaults are the pure, dependency-light, parse-only formats. `pickle`
# (torch .pt) is an explicit opt-in: parsing pickle is a larger attack
# surface than any other format here, even through a restricted VM.
default = ["safetensors", "gguf"]
safetensors = ["dep:serde_json"]
gguf = []
npz = ["dep:zip"]
pickle = ["dep:zip"]
hdf5 = ["dep:flate2"]
onnx = []

[dependencies]
ztensor = { path = "../ztensor" }
memmap2 = "0.9"
serde_json = { version = "1", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
flate2 = { version = "1", optional = true }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
