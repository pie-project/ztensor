[package]
name = "ztensor-py"
version = "1.3.0"
description = "Python bindings for zTensor: read any tensor format, write canonical .zt"
authors = ["In Gim <in.gim@icloud.com>"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_ztensor"
crate-type = ["cdylib"]

[dependencies]
# Not abi3: the buffer protocol (zero-copy views into the mapping) is not
# part of the limited API, and zero-copy is the point of this binding.
pyo3 = { version = "0.26", features = ["extension-module"] }
ztensor = { path = "../ztensor", features = ["zstd"] }
ztensor-compat = { path = "../ztensor-compat", features = [
    "safetensors",
    "gguf",
    "npz",
    "pickle",
    "hdf5",
    "onnx",
] }
