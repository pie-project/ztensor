[package]
name = "ztensor-py"
# Versioned apart from the crates on purpose. This crate ships to PyPI and
# nowhere else, so a change confined to the bindings should not move
# `ztensor` on crates.io, and a crate release should not force a wheel build
# that has nothing new in it. `pyproject.toml` carries the same number, and
# the `py-v*` tag is checked against both.
version = "2.1.2"
description = "Python bindings for zTensor: read any tensor format, write canonical .zt"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# This crate ships to PyPI as a wheel; there is nothing on crates.io that
# could use a cdylib.
publish = false

[lib]
name = "_ztensor"
crate-type = ["cdylib"]

[dependencies]
# Not abi3: the buffer protocol (zero-copy views into the mapping) is not
# part of the limited API, and zero-copy is the point of this binding.
pyo3 = { version = "0.26", features = ["extension-module"] }
ztensor = { workspace = true, features = ["zstd"] }
ztensor-compat = { workspace = true, features = [
    "safetensors",
    "gguf",
    "npz",
    "pickle",
    "hdf5",
    "onnx",
] }
