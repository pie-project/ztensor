[package]
name = "ztensor"
version.workspace = true
description = "zTensor v2: an aligned, verifiable container format for tensor data"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tensor", "checkpoint", "mmap", "container", "safetensors"]
categories = ["encoding", "data-structures", "science"]

[package.metadata.docs.rs]
all-features = true

[features]
# zt.zstd-seekable/1 encoding profile
zstd = ["dep:zstd"]

[dependencies]
memmap2 = "0.9"
# §6.4 makes a cryptographic shard digest the thing that lets one signature
# over a root cover every shard byte. A build that could produce those digests
# but not check them would be worse than one that could do neither, so this is
# not optional.
sha2 = "0.10"
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
